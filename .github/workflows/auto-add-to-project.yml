name: Auto Add Issues to GPMH Project #2

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add issue to GPMH SaaS .NET Project #2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ secrets.PROJECT_URL || 'https://github.com/users/AvinashRamrajTonde/projects/2' }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT || secrets.GITHUB_TOKEN }}

