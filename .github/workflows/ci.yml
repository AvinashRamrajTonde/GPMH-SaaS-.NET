name: GPMH SaaS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & Test (.NET Clean Architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
      - name: Restore dependencies
        run: dotnet restore GPMH.sln
      - name: Build solution
        run: dotnet build GPMH.sln --no-restore --configuration Release
      - name: Run unit, architecture & integration tests
        run: dotnet test GPMH.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Build & Lint (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lgd-api:
    name: Verify External LGD Directory API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP & SQLite extensions
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: Run LGD API smoke tests
        run: bash external-api-proj/tests/test_api.sh

